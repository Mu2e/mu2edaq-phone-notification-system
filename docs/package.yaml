    - org.mu2edaq.notify-server (launchd LaunchAgent, plist not in repo)
    - org.mu2edaq.notify-proxy-tunnel (launchd LaunchAgent, plist not in repo)
    - mu2edaq-notify-dns.service (EC2 proxy, config/aws/)
