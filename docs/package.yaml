      kind: cli
      waiver: "example program (src/cpp/examples/publish_example.cpp), documented in mu2edaq_notify_cpp(3) EXAMPLES; installed to bin by CMakeLists.txt:50 (PNS-011)"
    - name: Mu2eNotify
      kind: gui
      waiver: "iOS app (ios/Mu2eNotify), not a host executable; build in ios/README.md, server surface in docs/INTERFACES.md section 8"
    - name: build.mjs
      kind: script
      waiver: "presentation build source for deliverables/mu2edaq-notify-architecture, not an operational tool"
