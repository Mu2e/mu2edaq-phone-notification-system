interactions:
  depends_on:
    - package: mu2edaq-discovery
      via: import
      direction: out
      optional: true
      evidence: "src/mu2edaq_notify/server/cli.py:143"
      note: "server imports Responder to ANNOUNCE app=notify; meta values are strings (cli.py:125-135)"
    - package: mu2edaq-discovery
      via: import
      direction: out
      optional: true
      evidence: "src/mu2edaq_notify/publisher.py:75"
      note: "Python publisher imports discover() to find the server"
    - package: mu2edaq-discovery
      via: udp
      direction: out
      optional: true
      evidence: "src/cpp/notify.cpp:159"
      note: "C++ publisher speaks the mu2edaq-discovery/1 DISCOVER protocol itself; does not link the library"
  depended_on_by: []
  external:
    - apple-apns
    - slack-webhook
    - discord-webhook
    - aws-ec2
    - aws-route53
    - okd
    - hashicorp-vault (deploy time only)
    - letsencrypt
    - fermilab-sso-oidc (optional, off in shipped config)
    - cdn (tailwind, htmx)

