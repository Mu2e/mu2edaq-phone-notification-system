    - {port: 8096, proto: tcp, role: zmq-pull-ingest-disabled-by-default, source: "src/mu2edaq_notify/server/config.py:66"}
    - {port: 28999, proto: udp, role: discovery-responder-multicast-239.255.42.99, source: "src/cpp/notify.cpp:34"}
    - {port: 18095, proto: tcp, role: reverse-ssh-tunnel-on-ec2-loopback, source: "scripts/start-mu2edaq-notify-chain.sh:19"}
    - {port: 443, proto: tcp, role: public-https-ec2-caddy, source: "config/aws/Caddyfile:17"}
    - {port: 8080, proto: tcp, role: okd-caddy-pod, source: "helm/templates/configmap.yaml:10"}
