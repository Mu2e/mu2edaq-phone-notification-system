notes:
  dedup: >
    gh issue list --state all (read) on 2026-10-06 returned #1-#15, all open, none
    carrying a mega-review fingerprint. Four findings are comments on existing
    issues by the section 6 rule 2 title-overlap judgement: PNS-023 on #1
    (unauthenticated web admin), PNS-009 on #15 (APNs test isolation), PNS-018 on
    #4 (config path handling), PNS-006 on #3 (publisher tokens). 13 new issues,
    under the 15-issue cap. ISSUES-PENDING.md parses with
    docs/mega-review/tools/stage_issues.py (17 records, no problems).
  zmq_verdict: >
    Confirmed. The PULL bind on 8096 (zmq_listener.py:73-79, config.py:66) is
    transport-compatible with a mu2edaq-dashboard PUSH sender pointed at it; the SUB
    mode cannot reach the dashboard (PULL on 5555, no PUB). normalize_event reads
    severity/source/category (events.py:64,74,77), the bus carries
    error_level/subsystem/event_category (mu2edaq-dashboard/sender.py:90-97), so every
    dashboard level arrives as zmq.default_severity=warning (config.py:67), source
    zmq, no category. Reproduced through ZmqListener._parse for all five levels.
    Under the shipped errors-to-phones rule (min_severity error) a dashboard error
    does not page at all. S3 (PNS-001) because zmq.enabled defaults to false
    (config.py:64, config/notify-server.yaml:76) and no shipped sender targets 8096.
  credentials: >
    config/apns_key.p8 and auth.api_tokens are gitignored (.gitignore:10,13) and
    absent from this repository's history; no exposure filed here. The APNs key
    tracked in mu2edaq-config is a superproject matter. Reviewed handling:
    the running server never contacts Vault; deploy-okd-proxy.sh fails closed on
    any Vault auth/permission/connection error (vault_client.py:444,
    deploy-okd-proxy.sh:199-203) and the chart refuses to render tunnel mode
    without its keytab (helm/templates/tunnel-secret.yaml:15-17). Publisher tokens
    are compared with list membership (PNS-006, S4); device tokens are SHA-256
    hashed and looked up by hash. Token scoping: any publisher token may publish
    as any source and read all history; enrollment JWTs are reusable within their
    30 min TTL. Secrets in logs: database URL with password and enrollment JWTs in
    Werkzeug request lines (PNS-017). The draft's claim that session and enrollment
    secrets regenerate on every restart is confirmed (config.py:182-189; no
    persistence anywhere, contrary to config/notify-server.yaml:33) and kept at S4
    (PNS-005).
  s1_basis: >
    PNS-023 is assessed S1 from tracked evidence: the production launchd agent
    runs config/notify-server.yaml (OIDC off), both proxies forward every path,
    and the Flask test client shows anonymous enrollment and destination deletion.
    The live endpoints and the EC2 security group were not probed.
  production_tree: >
    The launchd agent's WorkingDirectory is this superproject checkout, so the
    production pager runs whatever branch is checked out here (2026-10-06:
    mu2e-sept-mega-review) at its next restart. This review changed documentation
    only.
  stale_man_paths: >
    After the man/manN move, two references to flat paths remain in files this
    review may not edit: CMakeLists.txt:60,62 (install(FILES man/... OPTIONAL), now
    installs no man pages silently; PNS-011) and scripts/vault_client.py:30
    (docstring names man/vault-client.1; PNS-026). No test, script or doc reads a
    man path.
  doc_dir: >
    Both doc/ (empty, untracked, unreferenced) and docs/ exist; docs/ is used.
    doc/ is staged as S4 (PNS-010) and was not deleted.
  loc: >
    Tracked code: Python 5140 (2305 tests), shell 3311, Swift 1049, C++ 546,
    JavaScript 588 (deck build), HTML templates 493, CMake 63, YAML/Helm 836,
    systemd/Caddy/templates 123. Markdown, man pages, JSON and binaries excluded.
  tests: >
    pytest 185 (all pass from the repository root on a host holding
    config/apns_key.p8; 1 fails elsewhere, #15). One CppUnit test, built only when
    CppUnit is found (CMakeLists.txt:33-45). One XCTest target under ios/.
  artifacts: >
    git ls-files shows no venv, build tree, database or key. The tracked
    deliverables/mu2edaq-notify-architecture/output/output.pptx and its source
    images are intentional (commit 006cadb, .gitignore comments).
  license: >
    LICENSE is MIT; pyproject.toml:11 declares BSD-3-Clause (PNS-024).
  completion_pass: >
    Completed from two terminated agents' drafts. Every draft claim cited in the
    docs was re-checked against source; corrections made: bootstrap.sh(1) wrongly
    said re-runs upgrade packages; mu2edaq-notify(1) and OPERATIONS.md now state
    that the publisher verifies TLS with no override (the draft's
    --server https://localhost:8095 check would fail); start-chain/stop-proxy
    environment and exit-status wording; ISSUES-PENDING.md made parseable
    (Title lines, numeric rollup id PNS-029, one fingerprint comment per body).
    All five pre-existing-file edits were man-path corrections and were kept.
