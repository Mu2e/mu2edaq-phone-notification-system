{{- if .Values.backend.tunnel.enabled }}
# Keytab for the ssh-tunnel sidecar's Kerberos auth. Sourced from Vault --
# see docs/Vault-Secrets.md -- never set backend.tunnel.principal/keytabB64
# to a real value in a committed file.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-tunnel-keytab
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mu2edaq-pager.labels" . | nindent 4 }}
type: Opaque
data:
  # Already base64 -- see the comment on backend.tunnel.keytabB64 in values.yaml.
  keytab: {{ required "backend.tunnel.keytabB64 is required when backend.tunnel.enabled is true -- see docs/Vault-Secrets.md" .Values.backend.tunnel.keytabB64 | quote }}
stringData:
  principal: {{ required "backend.tunnel.principal is required when backend.tunnel.enabled is true -- see docs/Vault-Secrets.md" .Values.backend.tunnel.principal | quote }}
{{- end }}
