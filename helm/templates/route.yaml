{{- if .Values.route.hostname }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    haproxy.router.openshift.io/timeout: {{ .Values.route.timeout | quote }}
  labels:
    {{- include "mu2edaq-pager.labels" . | nindent 4 }}
    {{- if .Values.route.ingressController }}
    ingresscontroller: {{ .Values.route.ingressController | quote }}
    {{- end }}
spec:
  host: {{ .Values.route.hostname }}
  to:
    kind: Service
    name: {{ .Release.Name }}
    weight: 100
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
    {{- if and .Values.certManager.externalCertificate .Values.certManager.secretName }}
    externalCertificate:
      name: {{ .Values.certManager.secretName }}
    {{- end }}
{{- end }}
