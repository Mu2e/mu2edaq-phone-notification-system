# Installed on the EC2 proxy as
# /etc/systemd/system/caddy.service.d/10-wait-for-dns.conf
#
# Caddy's ACME client resolves notify.andrewnorman.org and answers the HTTP-01
# challenge on this host's public address. Starting it before the A record has
# been moved to the current address risks a failed validation and a Let's
# Encrypt rate-limit penalty, so order Caddy after the DNS update.
#
# Wants=, not Requires=: an existing certificate is valid for up to 90 days, so
# a Route 53 failure must not take the proxy offline.
[Unit]
Wants=mu2edaq-notify-dns.service
After=mu2edaq-notify-dns.service
