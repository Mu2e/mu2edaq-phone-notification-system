# Configuration for mu2edaq-notify-dns-update, installed on the EC2 proxy as
# /etc/mu2edaq-notify-dns.conf. Sourced by the script, so shell syntax only.
#
# Command line and environment override anything set here.

# Route 53 hosted zone holding the public record (andrewnorman.org).
MU2EDAQ_NOTIFY_ROUTE53_ZONE_ID=Z2OL4WKH228GKD

# Record the instance maintains. The IAM policy pins this exact name, so
# changing it here also means changing the policy condition.
MU2EDAQ_NOTIFY_DNS_RECORD=notify.andrewnorman.org

# Short TTL: the address changes on every instance start, and clients must not
# cache the old one for long. Route 53 charges per query, and this record sees
# only a handful of clients, so 60s is free in practice.
MU2EDAQ_NOTIFY_DNS_TTL=60

# Wait for the change to reach INSYNC before returning. The boot unit is
# ordered before caddy.service, so waiting here means Caddy's ACME renewal
# never races a stale A record.
MU2EDAQ_NOTIFY_DNS_WAIT=1

# IMDS retry budget while the public IPv4 is still being attached.
MU2EDAQ_NOTIFY_DNS_IP_TRIES=30
MU2EDAQ_NOTIFY_DNS_IP_DELAY=2

MU2EDAQ_NOTIFY_DNS_LOGFILE=/var/log/mu2edaq-notify-dns.log
